<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lådans hemlighet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: rutat räknehäfte. Uppgiften överst, sedan två kolumner: lådan + vågen (bild) bredvid stegen (lösningen). */
:root {
  --paper: #f5f8fd; --grid: #e2eaf6; --card: #ffffff; --ink: #1b2742; --muted: #5a6886; --line: #d3ddec;
  --accent: #2c56d8; --accent-ink: #ffffff; --accent-soft: #e6edff;
  --l: #d9482b; --b: #0d8a7b; --h: #7b45e8; --s: #c46200; --V: #1b2742;
  --good: #1d8a4f; --good-soft: #e2f4e9; --bad: #c43a3a; --bad-soft: #fdeaea; --star: #e9a100;
  --box-top: #ecc996; --box-left: #d6a868; --box-right: #bf8c4c; --box-edge: #7d5629; --tape: #f7e6c4;
  --c1-top: #c3d4ff; --c1-left: #86a3f2; --c1-right: #5878d6;
  --c2-top: #ffe3a6; --c2-left: #f2bb47; --c2-right: #d4961c; --c-edge: #1b2742;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1626; --grid: #172139; --card: #162038; --ink: #e7edfb; --muted: #9aa8c6; --line: #2a3757;
    --accent: #84a1ff; --accent-ink: #0f1626; --accent-soft: #1f2c4d;
    --l: #ff8466; --b: #43d3bf; --h: #b791ff; --s: #ffae52; --V: #e7edfb;
    --good: #55d18f; --good-soft: #163628; --bad: #ff8080; --bad-soft: #3a1d24; --star: #ffcb45;
    --box-top: #b48d5c; --box-left: #977242; --box-right: #7b5b31; --box-edge: #2e1f0d; --tape: #cfae7a;
    --c1-top: #7896ea; --c1-left: #4a69c6; --c1-right: #34519f;
    --c2-top: #ecbe58; --c2-left: #c99325; --c2-right: #9e7113; --c-edge: #0b1120;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1626; --grid: #172139; --card: #162038; --ink: #e7edfb; --muted: #9aa8c6; --line: #2a3757;
  --accent: #84a1ff; --accent-ink: #0f1626; --accent-soft: #1f2c4d;
  --l: #ff8466; --b: #43d3bf; --h: #b791ff; --s: #ffae52; --V: #e7edfb;
  --good: #55d18f; --good-soft: #163628; --bad: #ff8080; --bad-soft: #3a1d24; --star: #ffcb45;
  --box-top: #b48d5c; --box-left: #977242; --box-right: #7b5b31; --box-edge: #2e1f0d; --tape: #cfae7a;
  --c1-top: #7896ea; --c1-left: #4a69c6; --c1-right: #34519f;
  --c2-top: #ecbe58; --c2-left: #c99325; --c2-right: #9e7113; --c-edge: #0b1120;
  color-scheme: dark;
}

body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
h1, h2, .display { font-family: var(--font-display); text-wrap: balance; }

/* Header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
.top h1 .q { color: var(--accent); }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }
.stars {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--card); border: 2px solid var(--line); border-radius: 999px;
  padding: 6px 16px 6px 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem;
}
.stars svg { width: 26px; height: 26px; fill: var(--star); }
.stars.pop { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.18); } }

/* Cards */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; }
.task { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.label {
  font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.task-text { margin: 0; font-size: 1.3rem; line-height: 1.5; font-weight: 600; max-width: 62ch; }
.task-text b { font-weight: 800; }
.w { font-weight: 800; border-bottom: 3px solid currentColor; }
.w-l { color: var(--l); } .w-b { color: var(--b); } .w-h { color: var(--h); } .w-s { color: var(--s); }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.level { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.level button {
  font: inherit; font-weight: 700; padding: 8px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
}
.level button + button { border-left: 2px solid var(--line); }
.level button.on { background: var(--accent-soft); color: var(--accent); }

.btn {
  font: inherit; font-weight: 800; padding: 9px 18px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--accent); transition: transform .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, var(--ink)); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.big { font-size: 1.15rem; padding: 12px 24px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Two columns */
.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }
.visual { display: flex; flex-direction: column; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.vis-card { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.vis-card svg { width: 100%; height: auto; display: block; }
.caption { margin: 0; color: var(--muted); font-size: .92rem; }
.caption b { color: var(--ink); }

/* Box SVG */
.bx-t { fill: var(--box-top); } .bx-l { fill: var(--box-left); } .bx-r { fill: var(--box-right); }
.bx-t, .bx-l, .bx-r { stroke: var(--box-edge); stroke-width: 1.6; stroke-linejoin: round; }
.tape { stroke: var(--tape); stroke-width: 9; stroke-linecap: butt; opacity: .85; }
.qmark { fill: var(--box-edge); font-family: var(--font-display); font-weight: 800; opacity: .55; }
.ghost { fill: var(--accent-soft); fill-opacity: .5; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.cube polygon { stroke: var(--c-edge); stroke-width: 1; stroke-linejoin: round; }
.cube .t { fill: var(--c1-top); } .cube .lf { fill: var(--c1-left); } .cube .rt { fill: var(--c1-right); }
.cube.alt .t { fill: var(--c2-top); } .cube.alt .lf { fill: var(--c2-left); } .cube.alt .rt { fill: var(--c2-right); }
.cube.hid { opacity: 0; }
.cube.show { animation: drop .28s ease-out both; }
@keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.edge-l { stroke: var(--l); } .edge-b { stroke: var(--b); } .edge-h { stroke: var(--h); }
.edge { stroke-width: 4; stroke-linecap: round; }
.lab { font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.lab-l { fill: var(--l); } .lab-b { fill: var(--b); } .lab-h { fill: var(--h); }

/* Scale */
.scale { position: relative; width: 100%; aspect-ratio: 320 / 200; max-width: 100%; }
.scale svg { position: absolute; inset: 0; }
.sc-post { stroke: var(--muted); stroke-width: 6; stroke-linecap: round; }
.sc-foot { fill: var(--muted); }
.sc-beam { stroke: var(--ink); stroke-width: 7; stroke-linecap: round; }
.sc-pivot { fill: var(--star); stroke: var(--ink); stroke-width: 2; }
.sc-string { stroke: var(--muted); stroke-width: 1.5; }
.sc-pan { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.pan {
  position: absolute; transform: translate(-50%, -100%);
  font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 2.6vw, 1.35rem);
  white-space: nowrap; line-height: 1.1; text-align: center;
}
.op-badge {
  position: absolute; left: 50%; top: -1.6em; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 10px; font-size: .85em;
  animation: badge .9s ease both;
}
@keyframes badge { 0% { opacity: 0; top: -3em; } 30% { opacity: 1; top: -1.6em; } 100% { opacity: 1; } }

/* Math typography */
.var { font-style: italic; font-weight: 800; font-family: var(--font-display); }
.v-l { color: var(--l); } .v-b { color: var(--b); } .v-h { color: var(--h); } .v-s { color: var(--s); } .v-V { color: var(--V); }
.g { font-weight: 800; text-decoration: underline 3px; text-underline-offset: 4px; }
.g-l { text-decoration-color: var(--l); } .g-b { text-decoration-color: var(--b); } .g-h { text-decoration-color: var(--h); }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .82em; line-height: 1.05; margin: 0 .12em; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em .05em; }
.frac > span:last-child { padding-top: .05em; }
sup { font-size: .62em; line-height: 0; }

/* Steps */
.steps { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.step { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 20px; min-width: 0; }
.step.active { border-color: var(--accent); box-shadow: 0 6px 0 var(--accent-soft); animation: rise .35s ease both; }
.step.done { border-style: dashed; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.step-h { display: flex; align-items: center; gap: 12px; }
.step-n {
  flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 800; font-size: 1.15rem;
}
.step.done .step-n { background: var(--good); }
.step-h h2 { margin: 0; font-size: 1.35rem; line-height: 1.2; flex: 1; font-weight: 700; }
.step-of { color: var(--muted); font-size: .85rem; font-weight: 700; white-space: nowrap; }
.step p { margin: 0; max-width: 62ch; }
.step q { font-weight: 700; quotes: "”" "”"; }
.eqs { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--paper); border-radius: 12px; overflow-x: auto; }
.eq { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; display: flex; align-items: center; gap: .35em; flex-wrap: wrap; }
.eq .note { font-family: var(--font-body); font-size: .85rem; color: var(--muted); font-weight: 600; margin-left: .6em; }
.q { font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 10px; }
.opt {
  font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; color: var(--ink);
  background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 8px 18px; cursor: pointer;
  box-shadow: 0 3px 0 var(--line); transition: transform .12s ease, border-color .12s ease;
}
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrongopt { border-color: var(--bad); background: var(--bad-soft); opacity: .7; cursor: default; }
.numq { display: flex; flex-direction: column; gap: 8px; }
.numq label { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; display: flex; align-items: center; gap: .3em; flex-wrap: wrap; }
.numq .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.num-in {
  font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; width: 5.5em; padding: 4px 10px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); text-align: center;
}
.num-in.ok { border-color: var(--good); background: var(--good-soft); }
.num-in.no { border-color: var(--bad); background: var(--bad-soft); }
.feedback { font-weight: 800; min-height: 1.4em; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.step-foot { display: flex; gap: 10px; }
.hint-btn {
  font: inherit; font-weight: 700; font-size: .9rem; color: var(--muted); background: transparent;
  border: 2px dashed var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer;
}
.hint { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.done-line { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: .4em; flex-wrap: wrap; }
.check { color: var(--good); font-weight: 800; }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Try widget */
.tryer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: center; }
.tryer svg { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--accent); background: var(--accent-soft);
  color: var(--accent); font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; cursor: pointer; line-height: 1;
}
.stepper output { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; min-width: 1.6em; text-align: center; }
.try-res { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; margin-top: 8px; }
.try-msg { font-weight: 800; }
.sq { fill: color-mix(in srgb, var(--l) 22%, var(--card)); stroke: var(--l); stroke-width: 1.2; }
.sq-b { fill: color-mix(in srgb, var(--b) 22%, var(--card)); stroke: var(--b); }
.note-small { font-size: .9rem; color: var(--muted); }

/* Build */
.build-svg { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; }
.counter { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; text-align: center; min-height: 1.5em; }
.inputs { display: flex; flex-direction: column; gap: 10px; }

/* Summary */
.summary { border-color: var(--good); }
.notebook {
  background: var(--paper); border-radius: 12px; padding: 14px 18px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; overflow-x: auto;
}
.notebook .eq { font-size: 1.35rem; }
.answer { font-size: 1.2rem; font-weight: 800; }
.answer-row { display: flex; gap: 10px; flex-wrap: wrap; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (max-width: 860px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .visual { position: static; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .visual { grid-template-columns: minmax(0, 1fr); }
  .scale-slot .vis-card { border: 0; padding: 0; background: transparent; }
  .scale-slot .caption { display: none; }
  .scale-slot .scale { max-width: 360px; margin: 0 auto; }
  .step-of { display: none; }
  .step { padding: 16px; }
  .step-h h2 { font-size: 1.2rem; }
  .lab { font-size: 23px; }
  .opt { font-size: 1.2rem; padding: 8px 14px; }
  .top h1 { font-size: 2.1rem; }
  .tryer { grid-template-columns: minmax(0, 1fr); }
  .tryer > div:last-child { order: -1; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .tryer svg { max-width: 190px; }
  .task-text { font-size: 1.15rem; }
  .eq { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Lådans hemlighet<span class="q">?</span></h1>
      <p class="sub">Ställ upp en ekvation, lös den steg för steg och bygg sedan lådan – kub för kub.</p>
    </div>
    <div class="stars" id="stars" aria-live="polite" title="Stjärnor: rätt på första försöket">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      <span id="starCount">0</span>
    </div>
  </header>

  <section class="card task" aria-labelledby="taskLabel">
    <div class="label" id="taskLabel">Uppgiften</div>
    <p class="task-text" id="taskText"></p>
    <div class="controls">
      <div class="level" role="group" aria-label="Svårighet">
        <button type="button" data-level="1">Lätt</button>
        <button type="button" data-level="2" class="on">Mellan</button>
        <button type="button" data-level="3">Svår</button>
      </div>
      <button type="button" id="newBtn" class="btn primary">Nytt tal</button>
      <button type="button" id="origBtn" class="btn ghost">Första talet (36 dm³)</button>
    </div>
  </section>

  <div class="grid">
    <aside class="visual">
      <div class="card vis-card">
        <div class="label">Lådan</div>
        <svg id="boxSvg" data-w="420" data-h="300" role="img" aria-label="Bild av lådan med dess mått"></svg>
        <p class="caption" id="boxCaption"></p>
      </div>
      <div class="card vis-card" id="scaleCard">
        <div class="label">Ekvationen är en våg</div>
        <div class="scale" id="scale">
          <svg viewBox="0 0 320 200" aria-hidden="true">
            <rect class="sc-foot" x="112" y="186" width="96" height="9" rx="4"></rect>
            <line class="sc-post" x1="160" y1="48" x2="160" y2="188"></line>
            <line class="sc-string" id="sL1"></line><line class="sc-string" id="sL2"></line>
            <line class="sc-string" id="sR1"></line><line class="sc-string" id="sR2"></line>
            <path class="sc-pan" id="panLPath"></path><path class="sc-pan" id="panRPath"></path>
            <line class="sc-beam" id="beam"></line>
            <circle class="sc-pivot" cx="160" cy="48" r="7"></circle>
          </svg>
          <div class="pan" id="panL"></div>
          <div class="pan" id="panR"></div>
        </div>
        <p class="caption">Vänster sida väger lika mycket som höger sida. Gör du något med ena sidan måste du göra samma sak med den andra – annars tippar vågen.</p>
      </div>
    </aside>
    <main class="steps" id="steps" aria-live="polite"></main>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
const $ = s => document.querySelector(s);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const F = (n, d = 1) => { const g = gcd(n, d); return { n: n / g, d: d / g }; };
const fmul = (a, b) => F(a.n * b.n, a.d * b.d);
const isOne = f => f.n === 1 && f.d === 1;
const X = (n = 1, d = 1) => ({ x: true, c: F(n, d) });
const G = v => ({ x: false, c: F(v) });
const KEYS = ['l', 'b', 'h'];
const NAMES = { l: 'längden', b: 'bredden', h: 'höjden', s: 'sidan' };
const ADJ = { l: 'lång', b: 'bred', h: 'hög' };
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ---------- math typography ---------- */
const V_ = v => `<i class="var v-${v}">${v}</i>`;
const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const numFrac = f => f.d === 1 ? `${f.n}` : frac(f.n, f.d);
const fmt = str => str.replace(/([lbhs])\/(\d+)|\b([lbhsV])\b/g, (m, a, d, c) => a ? frac(V_(a), d) : V_(c));

/* ---------- problem templates ---------- */
function build(o) {
  const { l, b, h } = o.sol;
  const V = l * b * h;
  let n = 0, C = F(1);
  const factors = [];
  KEYS.forEach(k => {
    const d = o.dims[k];
    if (d.x) { n++; if (!isOne(d.c)) factors.push(d.c); }
    else factors.push(d.c);
  });
  factors.forEach(f => C = fmul(C, f));
  const xVal = o.letter === 's' ? l : o.sol[o.letter];
  return { ...o, V, n, C: C.n / C.d, factors, xVal, R: V / (C.n / C.d),
    textHTML: `Volymen är <b>${V} dm³</b>. ` + mark(o.text) };
}
const TPL = {
  easy() {

    const dims = {}; KEYS.forEach(q => dims[q] = q === k ? X() : G(sol[q]));
    const giv = KEYS.filter(q => q !== k).map(q => `{${q}:${cap(NAMES[q])}} är ${sol[q]} dm.`).join(' ');
    return build({ kind: 'easy', letter: k, sol, dims, text: `${giv} Hur {${k}:${ADJ[k]}} är lådan?`, tr: null });
  },
  half(b = ri(2, 5), h = pick([2, 4])) {
    return build({ kind: 'half', letter: 'l', sol: { l: 2 * b, b, h }, dims: { l: X(), b: X(1, 2), h: G(h) },
      text: `{h:Höjden} är ${h} dm. {b:Bredden} är hälften av {l:längden}. Hur lång och hur bred är lådan?`,
      tr: { quote: '{b:Bredden} är hälften av {l:längden}.', opts: ['b = l/2', 'b = 2 · l', 'b = l − 2'],

  },
  square() {

      tr: { quote: '{h:Höjden} är lika stor som {b:bredden}.', opts: ['h = b', 'h = 2 · b', 'h = b + l'],

  third() {

      text: `{h:Höjden} är ${h} dm. {b:Bredden} är en tredjedel av {l:längden}. Hur lång och hur bred är lådan?`,

      tr: { quote: '{h:Höjden} är dubbelt så stor som {b:bredden}.', opts: ['h = 2 · b', 'h = b/2', 'h = b + 2'],

const LEVELS = { 1: ['easy'], 2: ['half', 'double', 'square', 'hEqB'], 3: ['third', 'cube', 'doubleH', 'double'] };
const ORIGINAL = () => TPL.half(3, 2);

/* ---------- state ---------- */
let P, STEPS, level = 2, gen = 0, qid = 0;
let stars = 0;
try { stars = parseInt(localStorage.getItem('ladans-hemlighet-stars') || '0', 10) || 0; } catch (e) {}
$('#starCount').textContent = stars;

  stars++;

  $('#starCount').textContent = stars;
  const s = $('#stars'); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');

/* ---------- expressions for current problem ---------- */
const xPow = () => V_(P.letter) + (P.n > 1 ? `<sup>${P.n}</sup>` : '');
const xTimes = () => Array(P.n).fill(V_(P.letter)).join(' · ');
function dimExpr(k, val) {
  const d = P.dims[k];
  if (!d.x) return `<span class="g g-${k}">${d.c.n}</span>`;
  const x = val != null ? `${val}` : V_(P.letter);
  if (isOne(d.c)) return x;
  if (d.c.d === 1) return `${d.c.n} · ${x}`;
  return frac(x, d.c.d);
}
const wrapExpr = k => { const d = P.dims[k]; const e = dimExpr(k); return d.x && d.c.d === 1 && d.c.n !== 1 ? `(${e})` : e; };
const subRHS = () => KEYS.map(wrapExpr).join(' · ');
const simplified = () => P.C === 1 ? xPow() : `${P.C} · ${xPow()}`;
const formulaRHS = () => `${V_('l')} · ${V_('b')} · ${V_('h')}`;
function labelPlain(k, solved) {
  if (solved) return `${k} = ${P.sol[k]} dm`;
  const d = P.dims[k];
  if (!d.x) return `${k} = ${d.c.n} dm`;
  if (k === P.letter) return `${k} = ?`;
  if (isOne(d.c)) return `${k} = ${P.letter}`;
  if (d.c.d === 1) return `${k} = ${d.c.n}·${P.letter}`;
  return `${k} = ${P.letter}/${d.c.d}`;
}

/* ---------- isometric box drawing ---------- */
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function drawBox(svg, L, B, H, opts = {}) {
  const W = +svg.dataset.w || 420, Hh = +svg.dataset.h || 300;
  svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
  svg.innerHTML = '';
  const c = 0.866;
  const padX = opts.labels ? 104 : 14, padY = opts.labels ? 38 : 12;
  const [fL, fB, fH] = opts.fit || [L, B, H];
  const s = Math.min((W - 2 * padX) / ((fL + fB) * c), (Hh - 2 * padY) / ((fL + fB) * 0.5 + fH), opts.maxS || 48);
  const minX = -B * c * s, maxX = L * c * s, minY = -H * s, maxY = (L + B) * 0.5 * s;
  const ox = W / 2 - (minX + maxX) / 2, oy = Hh / 2 - (minY + maxY) / 2;
  const Pt = (x, y, z) => [ox + (x - y) * c * s, oy + (x + y) * 0.5 * s - z * s];
  const poly = (pts, cls, parent) => mk('polygon', { points: pts.map(p => Pt(...p).map(v => v.toFixed(1)).join(',')).join(' '), class: cls }, parent);
  const faces = (x0, y0, z0, x1, y1, z1, cls, parent) => {
    poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], cls[0], parent);
    poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], cls[1], parent);
    poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], cls[2], parent);
  };
  const cubes = [];
  if (opts.mode === 'mystery') {
    faces(0, 0, 0, L, B, H, ['bx-t', 'bx-l', 'bx-r'], svg);
    const a = Pt(0, B / 2, H), b2 = Pt(L, B / 2, H);
    mk('line', { x1: a[0], y1: a[1], x2: b2[0], y2: b2[1], class: 'tape' }, svg);
    if (opts.question) {
      const m = Pt(L / 2, B, H / 2);
      const fs = Math.max(26, Math.min(80, s * Math.min(L, H) * 0.75));
      const t = mk('text', { x: m[0], y: m[1] + fs * 0.35, 'text-anchor': 'middle', class: 'qmark', 'font-size': fs }, svg);
      t.textContent = '?';
    }
  } else {
    if (opts.mode === 'cubes') faces(0, 0, 0, L, B, H, ['ghost', 'ghost', 'ghost'], svg);
    const all = [];
    for (let z = 0; z < H; z++) for (let y = 0; y < B; y++) for (let x = 0; x < L; x++) all.push({ x, y, z, i: all.length });
    const g = mk('g', {}, svg);
    all.slice().sort((p, q) => (p.x + p.y + p.z) - (q.x + q.y + q.z) || p.z - q.z).forEach(p => {
      const cg = mk('g', { class: 'cube' + (p.z % 2 ? ' alt' : '') + (opts.mode === 'cubes' ? ' hid' : '') }, g);
      faces(p.x, p.y, p.z, p.x + 1, p.y + 1, p.z + 1, ['t', 'lf', 'rt'], cg);
      cubes[p.i] = cg;
    });
  }
  if (opts.labels) {
    const edge = (a, b, k) => { const p = Pt(...a), q = Pt(...b); mk('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], class: `edge edge-${k}` }, svg); return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; };
    const text = (x, y, anchor, k, str) => { const t = mk('text', { x, y, 'text-anchor': anchor, class: `lab lab-${k}` }, svg); t.textContent = str; };
    const ml = edge([0, B, 0], [L, B, 0], 'l');
    const mb = edge([L, 0, 0], [L, B, 0], 'b');
    const mh = edge([0, B, 0], [0, B, H], 'h');
    text(ml[0] - 8, ml[1] + 26, 'end', 'l', opts.labels.l);
    text(mb[0] + 8, mb[1] + 26, 'start', 'b', opts.labels.b);
    text(mh[0] - 12, mh[1] + 6, 'end', 'h', opts.labels.h);
  }
  return cubes;
}
function drawMain(solved) {
  const labels = {}; KEYS.forEach(k => labels[k] = labelPlain(k, solved));
  drawBox($('#boxSvg'), P.sol.l, P.sol.b, P.sol.h, { mode: 'mystery', labels, question: !solved });
  $('#boxCaption').innerHTML = solved
    ? `Lådan är <b>${P.sol.l} · ${P.sol.b} · ${P.sol.h} = ${P.V} dm³</b>. Det är ${P.V} liter – lika mycket som ${P.V} mjölkpaket.`
    : `Volymen är <b>${P.V} dm³</b>. 1 dm³ är en kub som är 1 dm åt alla håll – lika mycket som 1 liter.`;
}

/* ---------- the scale ---------- */
const scale = { angle: 0, target: 0, raf: null };
function drawScale() {
  const a = scale.angle * Math.PI / 180, px = 160, py = 48, R = 112;
  const ends = [[px - R * Math.cos(a), py - R * Math.sin(a)], [px + R * Math.cos(a), py + R * Math.sin(a)]];
  const beam = $('#beam');
  beam.setAttribute('x1', ends[0][0]); beam.setAttribute('y1', ends[0][1]);
  beam.setAttribute('x2', ends[1][0]); beam.setAttribute('y2', ends[1][1]);
  [['L', ends[0]], ['R', ends[1]]].forEach(([side, [ex, ey]]) => {
    const s1 = $('#s' + side + '1'), s2 = $('#s' + side + '2');
    s1.setAttribute('x1', ex); s1.setAttribute('y1', ey); s1.setAttribute('x2', ex - 44); s1.setAttribute('y2', ey + 64);
    s2.setAttribute('x1', ex); s2.setAttribute('y1', ey); s2.setAttribute('x2', ex + 44); s2.setAttribute('y2', ey + 64);
    $('#pan' + side + 'Path').setAttribute('d', `M ${ex - 50} ${ey + 64} Q ${ex} ${ey + 94} ${ex + 50} ${ey + 64} Z`);
    const pan = $('#pan' + side);
    pan.style.left = (ex / 320 * 100) + '%';
    pan.style.top = ((ey + 61) / 200 * 100) + '%';
  });
}
function tiltTo(angle) {
  scale.target = angle;
  if (reduce) { scale.angle = angle; drawScale(); return; }
  if (scale.raf) return;
  const tick = () => {
    scale.angle += (scale.target - scale.angle) * 0.12;
    if (Math.abs(scale.target - scale.angle) < 0.05) { scale.angle = scale.target; scale.raf = null; drawScale(); return; }
    drawScale(); scale.raf = requestAnimationFrame(tick);
  };
  scale.raf = requestAnimationFrame(tick);
}
function setScale(left, right, angle = 0) { $('#panL').innerHTML = left; $('#panR').innerHTML = right; tiltTo(angle); }
function scaleOp(opHTML, left, right) {
  ['#panL', '#panR'].forEach(id => { const b = document.createElement('span'); b.className = 'op-badge'; b.innerHTML = opHTML; $(id).appendChild(b); });
  const my = gen;
  setTimeout(() => { if (my === gen) setScale(left, right, 0); }, reduce ? 0 : 1100);
}

/* ---------- step framework ---------- */
function feedback(ctx, ok, msg) {
  ctx.fb.className = 'feedback ' + (ok ? 'good' : 'bad');
  ctx.fb.innerHTML = msg;
}
function good(ctx) { feedback(ctx, true, pick(['Rätt!', 'Snyggt!', 'Precis!', 'Helt rätt!', 'Klockrent!'])); }
function wrong(ctx, msg) {
  ctx.attempts++;
  feedback(ctx, false, msg || pick(['Nästan! Prova igen.', 'Inte riktigt – titta en gång till.', 'Bra försök! Testa ett annat svar.']));
  ctx.el.classList.remove('shake'); void ctx.el.offsetWidth; ctx.el.classList.add('shake');
  if (ctx.attempts >= 2) ctx.showHint();
}
function choice(ctx, question, opts, onRight) {
  ctx.interact.innerHTML = `<p class="q">${question}</p><div class="opts"></div>`;
  const box = ctx.interact.querySelector('.opts');
  shuffle(opts).forEach(([html, ok]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.innerHTML = html;
    b.onclick = () => {
      if (ok) { b.classList.add('right'); box.querySelectorAll('button').forEach(x => x.disabled = true); good(ctx); onRight(); }
      else { b.classList.add('wrongopt'); b.disabled = true; wrong(ctx); }
    };
    box.appendChild(b);
  });
}
const parseNum = v => parseFloat(String(v).trim().replace(',', '.'));
function numberQ(ctx, labelHTML, answer, onRight) {
  const id = 'q' + (++qid);
  ctx.interact.innerHTML = `<form class="numq" novalidate><label for="${id}">${labelHTML}</label>
    <div class="row"><input class="num-in" id="${id}" inputmode="decimal" autocomplete="off" placeholder="?">
    <button class="btn primary" type="submit">Kolla</button></div></form>`;
  const form = ctx.interact.querySelector('form'), input = form.querySelector('input');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = parseNum(input.value);
    if (isNaN(v)) { feedback(ctx, false, 'Skriv ett tal i rutan.'); return; }
    if (Math.abs(v - answer) < 1e-9) {
      input.className = 'num-in ok'; input.disabled = true; form.querySelector('button').disabled = true;
      good(ctx); onRight();
    } else {
      input.className = 'num-in no';
      wrong(ctx, v > answer ? `${v} är för stort. Prova igen.` : `${v} är för litet. Prova igen.`);
    }
  });
  setTimeout(() => input.focus({ preventScroll: true }), 50);
}

function mountStep(i) {
  const st = STEPS[i], my = gen;
  const el = document.createElement('section');
  el.className = 'card step active';
  el.innerHTML = `<header class="step-h"><span class="step-n">${i + 1}</span><h2>${st.title}</h2><span class="step-of">Steg ${i + 1} av ${STEPS.length}</span></header>
    <div class="step-body">${st.body()}</div><div class="scale-slot"></div><div class="interact"></div><div class="feedback"></div>
    ${st.hint ? `<div class="step-foot"><button type="button" class="hint-btn">Visa ledtråd</button></div><div class="hint" hidden>${st.hint}</div>` : ''}`;
  $('#steps').appendChild(el);
  const ctx = {
    el, attempts: 0, interact: el.querySelector('.interact'), fb: el.querySelector('.feedback'),
    showHint() { const h = el.querySelector('.hint'); if (h) h.hidden = false; },
    complete(doneHTML, keep) {
      if (my !== gen) return;
      setTimeout(() => {
        if (my !== gen) return;
        el.classList.remove('active'); el.classList.add('done');
        const foot = el.querySelector('.step-foot'); if (foot) foot.remove();
        const h = el.querySelector('.hint'); if (h) h.hidden = true;
        if (doneHTML) {
          const d = `<div class="done-line"><span class="check" aria-hidden="true">✓</span>${doneHTML}</div>`;
          if (keep) ctx.interact.insertAdjacentHTML('beforeend', d); else ctx.interact.innerHTML = d;
        }
        if (ctx.attempts === 0) addStar();
        if (st.after) st.after();
        if (i + 1 < STEPS.length) mountStep(i + 1); else finish();
      }, reduce ? 150 : 650);
    },
  };
  const hb = el.querySelector('.hint-btn');
  if (hb) hb.onclick = () => ctx.showHint();
  placeScale();
  st.mount(ctx);
  if (i > 0) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
}

/* ---------- build the steps for the current problem ---------- */
function makeSteps() {
  const S = [];
  const lt = P.letter;
  S.push({
    title: 'Vilken formel räknar ut volymen?',
    body: () => `<p>Lådan har formen av ett <b>rätblock</b>. Volymen säger hur många kuber på 1 dm³ som får plats i den.</p>`,
    hint: 'Tänk dig att du fyller lådan: först ett lager kuber på botten (längden · bredden), sedan staplar du lager på lager ända upp till höjden.',
    mount: ctx => choice(ctx, 'Välj rätt formel:', [[fmt('V = l · b · h'), true], [fmt('V = l + b + h')], [fmt('V = 2 · l + 2 · b')]],
      () => ctx.complete(`${fmt('V = l · b · h')} <span class="note-small">volym = längd · bredd · höjd</span>`)),
    after: () => setScale(`${P.V}`, formulaRHS()),
  });
  if (P.tr) S.push({
    title: 'Översätt orden till matte',
    body: () => `<p>I texten står det: <q>${mark(P.tr.quote)}</q> Hur skriver man det med bokstäver?</p>`,
    hint: P.tr.hint,
    mount: ctx => choice(ctx, 'Välj rätt:', P.tr.opts.map((o, j) => [fmt(o), j === 0]),
      () => ctx.complete(`${fmt(P.tr.opts[0])} <span class="note-small">bra översatt!</span>`)),
  });
  // substitute
  const known = KEYS.filter(k => k !== lt).map(k => `${V_(k)} = ${dimExpr(k)}`);
  const grouped = P.factors.length
    ? `${P.factors.length > 1 ? '(' : ''}${P.factors.map(numFrac).join(' · ')}${P.factors.length > 1 ? ')' : ''} · ${P.n > 1 ? `(${xTimes()})` : V_(lt)}`
    : xTimes();
  let subHint;
  const fr = P.factors.find(f => f.d !== 1);
  if (P.factors.length >= 2 && fr) {
    const m = P.factors.filter(f => f !== fr).reduce((a, f) => a * f.n, 1);
    subHint = `${frac(1, fr.d)} · ${m} är samma sak som ${m} delat med ${fr.d}.`;
  } else if (P.factors.length >= 2) {
    subHint = `Multiplicera talen ett i taget, från vänster till höger.`;
  } else {
    subHint = `${xTimes()} betyder att ${V_(lt)} multipliceras med sig själv ${P.n} gånger. Det skrivs med en liten siffra uppe till höger.`;
  }
  S.push({
    title: 'Sätt in det du vet',
    body: () => `<p>Byt ut bokstäverna i formeln mot det vi vet: <b>V = ${P.V}</b> och ${andJoin(known)}.</p>
      <div class="eqs">${eq(V_('V'), formulaRHS())}${eq(P.V, subRHS(), 'sätt in')}${grouped !== subRHS() ? eq(P.V, grouped, 'i gånger får man byta ordning: siffror för sig, bokstäver för sig') : ''}</div>`,
    hint: subHint,
    mount: ctx => {
      setScale(`${P.V}`, subRHS());
      const done = () => ctx.complete(`${P.V} = ${simplified()}${P.n > 1 ? ` <span class="note-small">eftersom ${xTimes()} = ${xPow()}</span>` : ''}`);
      if (P.factors.length >= 2) {
        numberQ(ctx, `Räkna ihop siffrorna: ${P.factors.map(numFrac).join(' · ')} =`, P.C, done);
      } else {
        const x = V_(lt);
        const wrongs = P.n === 3 ? [`3 · ${x}`, `${x} + ${x} + ${x}`] : [`2 · ${x}`, `${x} + ${x}`];
        choice(ctx, `Hur skriver man ${xTimes()} kortare?`, [[xPow(), true], [wrongs[0]], [wrongs[1]]], done);
      }
    },
    after: () => setScale(`${P.V}`, simplified()),
  });
  if (P.C !== 1) S.push({
    title: `Dela båda sidor med ${P.C}`,
    body: () => `<div class="eqs">${eq(P.V, simplified())}</div>
      <p>Vi vill ha ${xPow()} ensamt på ena sidan. Därför delar vi <b>båda</b> sidorna med ${P.C}. Då är vågen fortfarande i balans.</p>`,
    hint: `Vilket tal gånger ${P.C} blir ${P.V}?`,
    mount: ctx => numberQ(ctx, `${P.V} ÷ ${P.C} =`, P.R, () => {
      scaleOp(`÷ ${P.C}`, `${P.R}`, xPow());
      ctx.complete(P.n === 1 ? `${V_(lt)} = ${P.R} dm <span class="note-small">${NAMES[lt]} är ${P.R} dm</span>` : `${xPow()} = ${P.R}`);
    }),
  });
  if (P.n >= 2) S.push({
    title: P.n === 2 ? 'Vilket tal gånger sig självt?' : 'Vilket tal gånger sig självt tre gånger?',
    body: () => P.n === 2
      ? `<div class="eqs">${eq(xPow(), P.R)}</div><p>Det betyder att ${xTimes()} = ${P.R}. Vi letar efter ett tal som gånger sig självt blir ${P.R}. Det kallas att dra <b>roten ur</b>: √${P.R}. Prova dig fram och se hur vågen rör sig!</p>`
      : `<div class="eqs">${eq(xPow(), P.R)}</div><p>Det betyder att ${xTimes()} = ${P.R}. Vi letar efter ett tal som gånger sig självt tre gånger blir ${P.R}. Det kallas <b>kubikroten</b>: ∛${P.R}. Prova dig fram!</p>`,
    hint: P.n === 2 ? `Kvadrattal att komma ihåg: 4 = 2·2, 9 = 3·3, 16 = 4·4, 25 = 5·5, 36 = 6·6, 49 = 7·7 …` : `Kubtal: 8 = 2·2·2, 27 = 3·3·3, 64 = 4·4·4, 125 = 5·5·5.`,
    mount: ctx => rootWidget(ctx),
    after: () => setScale(`${P.xVal}`, V_(lt)),
  });
  S.push({
    title: 'Räkna ut resten och bygg lådan',
    body: () => `<p>Nu vet vi att <b>${V_(lt)} = ${P.xVal} dm</b>. ${P.kind === 'cube' ? 'I en kub är alla kanter lika långa.' : 'Sätt in det för att räkna ut de andra måtten.'}</p>`,
    hint: null,
    mount: ctx => buildWidget(ctx),
  });
  return S;
}

/* ---------- root widget (prova dig fram) ---------- */
function rootWidget(ctx) {
  const lt = P.letter, maxK = P.xVal + 3;
  let k = 1, solved = false;
  ctx.interact.innerHTML = `<div class="tryer">
      <div><svg viewBox="0 0 260 260" data-w="260" data-h="260" role="img" aria-label="Bild av talet gånger sig självt"></svg></div>
      <div>
        <div class="stepper">
          <button type="button" class="minus" aria-label="Ett mindre">−</button>
          <output aria-live="polite">1</output>
          <button type="button" class="plus" aria-label="Ett större">+</button>
        </div>
        <div class="try-res"></div>
        <div class="try-msg"></div>
      </div></div>
      <p class="note-small">${P.n === 2 ? `Även (−${P.xVal}) · (−${P.xVal}) = ${P.R}, men en längd kan inte vara negativ. Därför räknar vi bara med det positiva svaret.` : ''}</p>`;
  const svg = ctx.interact.querySelector('svg'), out = ctx.interact.querySelector('output');
  const res = ctx.interact.querySelector('.try-res'), msg = ctx.interact.querySelector('.try-msg');
  const render = () => {
    out.textContent = k;
    const val = k ** P.n;
    svg.innerHTML = '';
    if (P.n === 2) {
      const cell = 240 / maxK;
      for (let y = 0; y < k; y++) for (let x = 0; x < k; x++)
        mk('rect', { x: 10 + x * cell, y: 10 + y * cell, width: cell - 2, height: cell - 2, rx: 3, class: 'sq' + (lt === 'b' ? ' sq-b' : '') }, svg);
    } else {
      drawBox(svg, k, k, k, { mode: 'solid', fit: [maxK, maxK, maxK] });
    }
    res.innerHTML = `${Array(P.n).fill(k).join(' · ')} = <b>${val}</b>`;
    const ang = Math.max(-14, Math.min(14, (val - P.R) / P.R * 14));
    setScale(`${P.R}`, `${Array(P.n).fill(k).join(' · ')}`, ang);
    if (val < P.R) { msg.className = 'try-msg feedback bad'; msg.textContent = `${val} är mindre än ${P.R}. Vågen tippar åt vänster – prova ett större tal.`; }
    else if (val > P.R) { msg.className = 'try-msg feedback bad'; msg.textContent = `${val} är större än ${P.R}. Vågen tippar åt höger – prova ett mindre tal.`; }
    else {
      msg.className = 'try-msg feedback good'; msg.textContent = `Exakt! Vågen är i balans.`;
      if (!solved) {
        solved = true;
        ctx.interact.querySelectorAll('.stepper button').forEach(b => b.disabled = true);
        ctx.complete(`${V_(lt)} = ${P.n === 2 ? '√' : '∛'}${P.R} = ${P.xVal} dm`, true);
      }
    }
  };
  ctx.interact.querySelector('.minus').onclick = () => { if (k > 1) { k--; render(); } };
  ctx.interact.querySelector('.plus').onclick = () => { if (k < maxK) { k++; render(); } };
  render();
}

/* ---------- final step: compute the rest and build ---------- */
function buildWidget(ctx) {
  const lt = P.letter;
  const rows = P.kind === 'cube' ? [] : KEYS.filter(k => P.dims[k].x && k !== lt);
  const showBuild = () => {
    const btnWrap = document.createElement('div');
    btnWrap.innerHTML = `<p>Alla mått: ${KEYS.map(k => `${V_(k)} = ${P.sol[k]} dm`).join(', ')}. Får det verkligen plats ${P.V} kuber? Bygg och se!</p>
      <div style="margin-top:10px"><button type="button" class="btn primary big">Bygg lådan!</button></div>`;
    ctx.interact.appendChild(btnWrap);
    drawMain(true);
    const btn = btnWrap.querySelector('button');
    btn.onclick = () => { btn.disabled = true; btnWrap.remove(); buildAnimation(ctx); };
  };
  if (!rows.length) {
    if (P.kind === 'cube') ctx.interact.innerHTML = `<div class="eqs">${eq(`${V_('l')} = ${V_('b')} = ${V_('h')}`, `${V_('s')} = ${P.xVal}`)}</div>`;
    showBuild();
    return;
  }
  const ids = rows.map(() => 'q' + (++qid));
  ctx.interact.innerHTML = `<form class="numq inputs" novalidate>
    ${rows.map((k, j) => `<label for="${ids[j]}">${V_(k)} = ${dimExpr(k, P.xVal)} = <input class="num-in" id="${ids[j]}" inputmode="decimal" autocomplete="off" placeholder="?"> dm</label>`).join('')}
    <div class="row"><button class="btn primary" type="submit">Kolla</button></div></form>`;
  const form = ctx.interact.querySelector('form');
  const inputs = [...form.querySelectorAll('input')];
  setTimeout(() => inputs[0].focus({ preventScroll: true }), 50);
  form.addEventListener('submit', e => {
    e.preventDefault();
    let all = true;
    rows.forEach((k, j) => {
      const v = parseNum(inputs[j].value);
      const ok = Math.abs(v - P.sol[k]) < 1e-9;
      inputs[j].className = 'num-in ' + (ok ? 'ok' : 'no');
      if (!ok) all = false;
    });
    if (!all) {
      const d = P.dims[rows[0]].c;
      wrong(ctx, d.d !== 1 ? `Nästan! Kom ihåg: ${frac(P.xVal, d.d)} betyder ${P.xVal} delat med ${d.d}.` : d.n !== 1 ? `Nästan! ${d.n} · ${P.xVal} betyder ${d.n} gånger ${P.xVal}.` : 'Nästan! Prova igen.');
      return;
    }
    inputs.forEach(i => i.disabled = true); form.querySelector('button').disabled = true;
    good(ctx);
    showBuild();
  });
}
function buildAnimation(ctx) {
  const { l, b, h } = P.sol, my = gen;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<svg class="build-svg" data-w="440" data-h="320" role="img" aria-label="Lådan fylls med kuber"></svg><div class="counter" aria-live="polite"></div>`;
  ctx.interact.appendChild(wrap);
  const svg = wrap.querySelector('svg'), counter = wrap.querySelector('.counter');
  const labels = { l: `l = ${l}`, b: `b = ${b}`, h: `h = ${h}` };
  const cubes = drawBox(svg, l, b, h, { mode: 'cubes', labels });
  const per = l * b;
  const end = () => {
    counter.innerHTML = `${h} ${h === 1 ? 'lager' : 'lager'} · ${per} kuber = <b>${P.V} kuber</b> = ${P.V} dm³ <span class="check">✓</span>`;
    ctx.complete(`Kontroll: ${l} · ${b} · ${h} = ${P.V} dm³`, true);
  };
  if (reduce) { cubes.forEach(c => c.classList.replace('hid', 'show')); end(); return; }
  const delay = Math.max(8, Math.min(70, 1800 / (l * b * h)));
  let i = 0;
  const next = () => {
    if (my !== gen) return;
    if (i >= cubes.length) { end(); return; }
    cubes[i].classList.replace('hid', 'show');
    i++;
    const layer = Math.ceil(i / per), inLayer = i - (layer - 1) * per;
    counter.innerHTML = `Lager ${layer}: ${inLayer} av ${per} kuber &nbsp;·&nbsp; totalt ${i}`;
    setTimeout(next, i % per === 0 ? delay + 380 : delay);
  };
  next();
}

/* ---------- summary ---------- */
function finish() {
  const lt = P.letter, lines = [];
  lines.push(eq(V_('V'), formulaRHS()));
  lines.push(eq(P.V, subRHS()));
  if (simplified() !== subRHS()) lines.push(eq(P.V, simplified()));
  if (P.C !== 1) lines.push(eq(xPow(), `${frac(P.V, P.C)} = ${P.R}`));
  if (P.n === 2) lines.push(eq(V_(lt), `√${P.R} = ${P.xVal}`));
  if (P.n === 3) lines.push(eq(V_(lt), `∛${P.R} = ${P.xVal}`));
  if (P.kind !== 'cube') KEYS.filter(k => P.dims[k].x && k !== lt).forEach(k => lines.push(eq(V_(k), `${dimExpr(k, P.xVal)} = ${P.sol[k]}`)));
  const { l, b, h } = P.sol;
  const answer = P.kind === 'cube'
    ? `Svar: Kubens kanter är ${l} dm långa.`
    : `Svar: Lådan är ${l} dm lång, ${b} dm bred och ${h} dm hög.`;
  const el = document.createElement('section');
  el.className = 'card step summary';
  el.innerHTML = `<header class="step-h"><span class="step-n" style="background:var(--star);color:var(--ink)">★</span><h2>Lådans hemlighet är löst!</h2></header>
    <p>Så här kan du skriva lösningen i ditt räknehäfte:</p>
    <div class="notebook">${lines.join('')}</div>
    <p class="answer">${answer}</p>
    <div class="answer-row">
      <button type="button" class="btn primary big" data-act="same">Nytt tal</button>
      ${level < 3 ? `<button type="button" class="btn ghost big" data-act="harder">Svårare tal</button>` : ''}
    </div>`;
  $('#steps').appendChild(el);
  placeScale();
  el.querySelector('[data-act="same"]').onclick = () => newProblem();
  const hb = el.querySelector('[data-act="harder"]');
  if (hb) hb.onclick = () => { setLevel(level + 1); newProblem(); };
  el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
  confetti();
}

/* ---------- confetti ---------- */
function confetti() {
  if (reduce) return;
  const cv = $('#confetti'), cx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--l', '--b', '--h', '--star', '--accent'].map(v => cs.getPropertyValue(v).trim());
  const parts = Array.from({ length: 150 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI,
    vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: pick(cols),
  }));
  const t0 = performance.now();
  const tick = t => {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(tick); else cx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(tick);
}

/* ---------- start / controls ---------- */
function start(p) {
  gen++;
  P = p; STEPS = makeSteps();
  $('#taskText').innerHTML = P.textHTML;
  drawMain(false);
  scale.angle = 0; setScale(`${P.V} dm³`, `<span style="color:var(--muted)">lådan</span>`, 0); drawScale();
  $('#steps').innerHTML = '';
  mountStep(0);
}
function newProblem() {
  let p, tries = 0;
  do { p = TPL[pick(LEVELS[level])](); tries++; } while (P && p.V === P.V && p.kind === P.kind && tries < 20);
  start(p);
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}
function setLevel(lv) {
  level = lv;
  document.querySelectorAll('.level button').forEach(b => b.classList.toggle('on', +b.dataset.level === lv));
}
document.querySelectorAll('.level button').forEach(b => b.onclick = () => { setLevel(+b.dataset.level); newProblem(); });
$('#newBtn').onclick = () => newProblem();
$('#origBtn').onclick = () => { setLevel(2); start(ORIGINAL()); };

/* På mobil följer vågen med in i det steg man jobbar med */
const mq = window.matchMedia('(max-width: 600px)');
function placeScale() {
  const card = $('#scaleCard'), slot = document.querySelector('.step.active .scale-slot');
  if (mq.matches && slot) { if (card.parentElement !== slot) slot.appendChild(card); }
  else if (card.parentElement !== $('.visual')) $('.visual').appendChild(card);
}
if (mq.addEventListener) mq.addEventListener('change', placeScale);

drawScale();
start(ORIGINAL());
})();
</script>
